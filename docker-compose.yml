services:
  # ============================================================
  # Ứng dụng Backend Node.js (kết nối trực tiếp tới Aiven Cloud)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST_NAME: 0.0.0.0
      # Biến DATABASE_URL sẽ được tự động nạp từ file .env
