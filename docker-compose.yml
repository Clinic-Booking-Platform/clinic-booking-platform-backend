services:
  # ============================================================
  # 1. Cơ sở dữ liệu MySQL
  # ============================================================
  mysql_db:
    image: mysql:8.0
    container_name: clinic_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_DATABASE:-clinic_booking}
    ports:
      # Map cổng 3307 máy thật vào cổng 3306 container để tránh trùng cổng nếu máy đã cài MySQL
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - clinic_network

  # ============================================================
  # 2. Ứng dụng Backend Node.js
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST_NAME: 0.0.0.0
      # Chuỗi kết nối tới container mysql_db qua mạng nội bộ Docker
      DATABASE_URL: "mysql://root:${DB_PASSWORD:-123456}@mysql_db:3306/${DB_DATABASE:-clinic_booking}"
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - clinic_network

  # ============================================================
  # 3. Giao diện quản lý Database trực quan (phpMyAdmin)
  # ============================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: clinic_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
    depends_on:
      - mysql_db
    networks:
      - clinic_network

# ============================================================
# Khai báo Volume & Network
# ============================================================
volumes:
  mysql_data:

networks:
  clinic_network:
    driver: bridge
