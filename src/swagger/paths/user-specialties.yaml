paths:
  /specialties:
    get:
      tags:
        - "3. User - Specialties"
      summary: "Danh sách chuyên khoa"
      description: |
        - Lấy danh sách chuyên khoa (active).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              schema:
                $ref: '#/components/responses/PaginatedResponse'
              example:
                status: "success"
                data:
                  data:
                    - id: 1
                      name: "Nội khoa"
                  meta:
                    total: 10
                    page: 1
                    lastPage: 2
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /specialties/{id}:
    get:
      tags:
        - "3. User - Specialties"
      summary: "Chi tiết chuyên khoa"
      description: |
        - Xem chi tiết chuyên khoa kèm danh sách bác sĩ.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: "Thành công"
          content:
            application/json:
              example:
                status: "success"
                data:
                  id: 1
                  name: "Nội khoa"
                  doctors: []
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
