# ============================================================
# SHARED SCHEMAS – Dùng chung cho tất cả path files
# ============================================================
components:
  schemas:
    # ── ENUMS ──
    RoleType:
      type: string
      enum: [ADMIN, DOCTOR, USER]
      description: "Loại vai trò trong hệ thống"

    AppointmentStatus:
      type: string
      enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW]
      description: |
        Trạng thái lịch hẹn:
        - PENDING: Chờ xác nhận
        - CONFIRMED: Đã xác nhận
        - COMPLETED: Đã hoàn thành
        - CANCELLED: Đã hủy
        - NO_SHOW: Không đến khám

    ScheduleStatus:
      type: string
      enum: [AVAILABLE, FULL, CANCELLED]
      description: |
        Trạng thái ca làm việc:
        - AVAILABLE: Còn chỗ
        - FULL: Đã đầy
        - CANCELLED: Đã hủy

    PaymentStatus:
      type: string
      enum: [UNPAID, PAID, FAILED, CANCELLED]
      description: |
        Trạng thái thanh toán:
        - UNPAID: Chưa thanh toán
        - PAID: Đã thanh toán
        - FAILED: Thanh toán thất bại
        - CANCELLED: Đã hủy

    PaymentMethod:
      type: string
      enum: [VNPAY, CASH]
      description: "Phương thức thanh toán"

    MedicalRecordStatus:
      type: string
      enum: [DRAFT, SIGNED]
      description: |
        Trạng thái hồ sơ bệnh án:
        - DRAFT: Bản nháp (có thể chỉnh sửa)
        - SIGNED: Đã ký (khóa vĩnh viễn)

    TimeType:
      type: string
      enum: [T1, T2, T3, T4, T5, T6, T7, T8]
      description: |
        Ca khám trong ngày:
        - T1: 08:00 - 09:00
        - T2: 09:00 - 10:00
        - T3: 10:00 - 11:00
        - T4: 11:00 - 12:00
        - T5: 13:00 - 14:00
        - T6: 14:00 - 15:00
        - T7: 15:00 - 16:00
        - T8: 16:00 - 17:00

    AppointmentType:
      type: string
      enum: [OFFLINE, ONLINE]
      description: "Loại hình khám: OFFLINE (trực tiếp), ONLINE (trực tuyến)"

    # ── RESPONSE MODELS ──
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: "Nguyễn Văn A"
        phone_number:
          type: string
          nullable: true
          example: "0901234567"
        email:
          type: string
          format: email
          example: "user@gmail.com"
        date_of_birth:
          type: string
          format: date
          nullable: true
          example: "1990-05-15"
        gender:
          type: string
          nullable: true
          example: "Nam"
        avatar:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/xxx/image/upload/avatar.jpg"
        roleId:
          type: integer
          nullable: true
          example: 2
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        role:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 2
            name:
              type: string
              example: "USER"

    Doctor:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 3
        specialty_id:
          type: integer
          example: 1
        description:
          type: string
          nullable: true
          example: "Bác sĩ chuyên khoa Nội tổng hợp, 10 năm kinh nghiệm"
        price:
          type: string
          example: "200000.00"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        user:
          $ref: "#/components/schemas/User"
        specialty:
          $ref: "#/components/schemas/Specialty"

    Specialty:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Nội tổng hợp"
        description:
          type: string
          nullable: true
          example: "Chuyên khoa khám và điều trị các bệnh nội khoa"
        image_url:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/xxx/image/upload/specialty.jpg"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null

    Schedule:
      type: object
      properties:
        id:
          type: integer
          example: 1
        doctor_id:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: "2026-09-25"
        time_type:
          type: string
          example: "T1"
        max_number:
          type: integer
          example: 10
        status:
          type: string
          example: "AVAILABLE"
        doctor:
          $ref: "#/components/schemas/Doctor"

    Package:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Gói khám tổng quát cơ bản"
        description:
          type: string
          nullable: true
          example: "Gói khám sức khỏe tổng quát bao gồm xét nghiệm máu, siêu âm"
        thumbnail_url:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/xxx/image/upload/package.jpg"
        price:
          type: string
          example: "500000.00"
        discount_price:
          type: string
          nullable: true
          example: "450000.00"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        package_detail:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            html_content:
              type: string
              example: "<h2>Chi tiết gói khám</h2><p>Bao gồm...</p>"

    Appointment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        doctor_id:
          type: integer
          nullable: true
          example: 1
        package_id:
          type: integer
          nullable: true
          example: null
        order_id:
          type: integer
          nullable: true
          example: null
        appointment_type:
          type: string
          example: "OFFLINE"
        meeting_link:
          type: string
          nullable: true
          example: null
        date:
          type: string
          format: date
          example: "2026-09-25"
        time_type:
          type: string
          example: "T1"
        patient_name:
          type: string
          example: "Nguyễn Văn A"
        patient_phone:
          type: string
          example: "0901234567"
        symptoms:
          type: string
          nullable: true
          example: "Đau đầu, sốt nhẹ"
        status:
          type: string
          example: "PENDING"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null

    Article:
      type: object
      properties:
        id:
          type: integer
          example: 1
        author_id:
          type: integer
          example: 1
        specialty_id:
          type: integer
          nullable: true
          example: 1
        title:
          type: string
          example: "Phòng ngừa bệnh tim mạch"
        slug:
          type: string
          example: "phong-ngua-benh-tim-mach"
        thumbnail_url:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/xxx/image/upload/article.jpg"
        short_description:
          type: string
          nullable: true
          example: "Hướng dẫn phòng ngừa các bệnh tim mạch thường gặp"
        views:
          type: integer
          example: 150
        created_at:
          type: string
          format: date-time
          example: "2026-09-20T10:30:00.000Z"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null

    Cart:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        sum:
          type: integer
          example: 3
        cart_details:
          type: array
          items:
            $ref: "#/components/schemas/CartDetail"

    CartDetail:
      type: object
      properties:
        id:
          type: integer
          example: 1
        cart_id:
          type: integer
          example: 1
        package_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        price:
          type: string
          example: "500000.00"
        package:
          $ref: "#/components/schemas/Package"

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        order_code:
          type: string
          example: "ORD-20260921-001"
        total_price:
          type: string
          example: "1500000.00"
        payment_method:
          type: string
          example: "VNPAY"
        payment_status:
          type: string
          example: "PAID"
        created_at:
          type: string
          format: date-time
          example: "2026-09-21T10:30:00.000Z"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          example: null

    OrderDetail:
      type: object
      properties:
        id:
          type: integer
          example: 1
        order_id:
          type: integer
          example: 1
        package_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        price:
          type: string
          example: "500000.00"

    Banner:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Khuyến mãi khám tổng quát"
        image_url:
          type: string
          example: "https://res.cloudinary.com/xxx/image/upload/banner.jpg"
        link_url:
          type: string
          nullable: true
          example: "https://phongkham.vn/khuyen-mai"
        sort_order:
          type: integer
          example: 1
        is_active:
          type: boolean
          example: true

    MedicalRecord:
      type: object
      properties:
        id:
          type: integer
          example: 1
        appointment_id:
          type: integer
          example: 1
        record_code:
          type: string
          example: "BA20260914-001"
        symptoms:
          type: string
          nullable: true
          example: "Đau đầu, sốt nhẹ"
        clinical_examination:
          type: string
          nullable: true
          example: "Bệnh nhân tỉnh, tiếp xúc tốt"
        diagnosis:
          type: string
          example: "Viêm họng cấp"
        icd10_code:
          type: string
          nullable: true
          example: "J02"
        icd10_name:
          type: string
          nullable: true
          example: "Viêm họng cấp"
        blood_pressure:
          type: string
          nullable: true
          example: "120/80"
        pulse:
          type: integer
          nullable: true
          example: 75
        temperature:
          type: string
          nullable: true
          example: "37.5"
        weight:
          type: string
          nullable: true
          example: "65.00"
        height:
          type: string
          nullable: true
          example: "170.00"
        doctor_advice:
          type: string
          nullable: true
          example: "Nghỉ ngơi, uống nhiều nước, tái khám sau 5 ngày"
        re_examination_date:
          type: string
          format: date
          nullable: true
          example: "2026-09-30"
        consultation_type:
          type: string
          example: "OFFLINE"
        recommendation:
          type: string
          nullable: true
          example: "Nên xét nghiệm máu nếu triệu chứng kéo dài"
        status:
          type: string
          example: "DRAFT"
        signed_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-09-21T10:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-21T10:00:00.000Z"

    PrescriptionItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        medical_record_id:
          type: integer
          example: 1
        medicine_name:
          type: string
          example: "Paracetamol 500mg"
        dosage:
          type: string
          example: "1 viên x 3 lần/ngày"
        quantity:
          type: integer
          example: 9
        unit:
          type: string
          example: "viên"
        instructions:
          type: string
          nullable: true
          example: "Uống sau ăn"

    MedicalRecordAttachment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        medical_record_id:
          type: integer
          example: 1
        file_url:
          type: string
          example: "https://res.cloudinary.com/xxx/image/upload/xetnghiem.pdf"
        file_name:
          type: string
          example: "ket-qua-xet-nghiem-mau.pdf"
        description:
          type: string
          nullable: true
          example: "Kết quả xét nghiệm máu tổng phân tích"
        created_at:
          type: string
          format: date-time
          example: "2026-09-21T10:00:00.000Z"

    Bank:
      type: object
      properties:
        bank_code:
          type: string
          example: "NCB"
        bank_name:
          type: string
          example: "Ngân hàng NCB"
        logo_link:
          type: string
          example: "https://sandbox.vnpayment.vn/paymentv2/images/NCB.png"
        bank_type:
          type: integer
          example: 0
        display_order:
          type: integer
          example: 0

    # ── REQUEST SCHEMAS ──
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: "Email đăng nhập (Bắt buộc)"
          example: "user@gmail.com"
        password:
          type: string
          description: "Mật khẩu (Bắt buộc)"
          example: "123456"

    RegisterRequest:
      type: object
      required: [fullname, email, password, confirmPassword]
      properties:
        fullname:
          type: string
          description: "Họ tên đầy đủ (Bắt buộc)"
          example: "Nguyễn Văn A"
        email:
          type: string
          format: email
          description: "Email đăng ký (Bắt buộc, không trùng)"
          example: "newuser@gmail.com"
        password:
          type: string
          description: "Mật khẩu (Bắt buộc)"
          example: "123456"
        confirmPassword:
          type: string
          description: "Xác nhận mật khẩu (Bắt buộc, phải trùng password)"
          example: "123456"

    RegisterDoctorRequest:
      type: object
      required: [fullname, email, password, specialty_id, price]
      properties:
        fullname:
          type: string
          description: "Họ tên bác sĩ (Bắt buộc)"
          example: "BS. Trần Văn B"
        email:
          type: string
          format: email
          description: "Email đăng nhập cho bác sĩ (Bắt buộc)"
          example: "bacsi@phongkham.vn"
        password:
          type: string
          description: "Mật khẩu (Bắt buộc)"
          example: "123456"
        confirmPassword:
          type: string
          description: "Xác nhận mật khẩu (Tùy chọn)"
          example: "123456"
        specialty_id:
          type: integer
          description: "ID chuyên khoa (Bắt buộc)"
          example: 1
        price:
          type: number
          description: "Giá khám (Bắt buộc)"
          example: 200000

    CreateAppointmentRequest:
      type: object
      required: [doctor_id, date, time_type, patient_name, patient_phone]
      properties:
        doctor_id:
          type: integer
          description: "ID bác sĩ (Bắt buộc)"
          example: 1
        date:
          type: string
          format: date
          description: "Ngày khám, format YYYY-MM-DD (Bắt buộc)"
          example: "2026-09-25"
        time_type:
          type: string
          enum: [T1, T2, T3, T4, T5, T6, T7, T8]
          description: |
            Ca khám (Bắt buộc):
            T1: 08:00-09:00, T2: 09:00-10:00, T3: 10:00-11:00, T4: 11:00-12:00
            T5: 13:00-14:00, T6: 14:00-15:00, T7: 15:00-16:00, T8: 16:00-17:00
          example: "T1"
        patient_name:
          type: string
          description: "Tên bệnh nhân (Bắt buộc)"
          example: "Nguyễn Văn A"
        patient_phone:
          type: string
          description: "SĐT bệnh nhân (Bắt buộc)"
          example: "0901234567"
        symptoms:
          type: string
          nullable: true
          description: "Triệu chứng / lý do khám (Tùy chọn)"
          example: "Đau đầu, sốt nhẹ 2 ngày"

    BookFromOrderRequest:
      type: object
      required: [doctor_id, date, time_type, patient_name, patient_phone]
      properties:
        doctor_id:
          type: integer
          description: "ID bác sĩ (Bắt buộc)"
          example: 1
        date:
          type: string
          format: date
          description: "Ngày khám (Bắt buộc)"
          example: "2026-09-25"
        time_type:
          type: string
          enum: [T1, T2, T3, T4, T5, T6, T7, T8]
          description: "Ca khám (Bắt buộc)"
          example: "T2"
        patient_name:
          type: string
          description: "Tên bệnh nhân (Bắt buộc)"
          example: "Nguyễn Văn A"
        patient_phone:
          type: string
          description: "SĐT bệnh nhân (Bắt buộc)"
          example: "0901234567"
        symptoms:
          type: string
          nullable: true
          description: "Triệu chứng (Tùy chọn)"
          example: "Ho kéo dài"

    CreateScheduleRequest:
      type: object
      required: [date, time_type]
      properties:
        doctor_id:
          type: integer
          description: "ID bác sĩ (Bắt buộc khi Admin tạo, Doctor tự động lấy từ token)"
          example: 1
        date:
          type: string
          format: date
          description: "Ngày làm việc (Bắt buộc)"
          example: "2026-09-25"
        time_type:
          type: string
          enum: [T1, T2, T3, T4, T5, T6, T7, T8]
          description: "Ca làm việc (Bắt buộc)"
          example: "T1"
        max_number:
          type: integer
          description: "Số bệnh nhân tối đa (Tùy chọn, mặc định = 10)"
          example: 10

    BulkCreateScheduleRequest:
      type: object
      required: [date, time_types]
      properties:
        doctor_id:
          type: integer
          description: "ID bác sĩ (Bắt buộc khi Admin tạo)"
          example: 1
        date:
          type: string
          format: date
          description: "Ngày làm việc (Bắt buộc)"
          example: "2026-09-25"
        time_types:
          type: array
          items:
            type: string
            enum: [T1, T2, T3, T4, T5, T6, T7, T8]
          description: "Danh sách ca làm việc (Bắt buộc)"
          example: ["T1", "T2", "T3", "T5", "T6"]
        max_number:
          type: integer
          description: "Số bệnh nhân tối đa mỗi ca (Tùy chọn, mặc định = 10)"
          example: 10

    UpdateScheduleRequest:
      type: object
      properties:
        max_number:
          type: integer
          description: "Số bệnh nhân tối đa (Tùy chọn)"
          example: 15
        status:
          type: string
          enum: [AVAILABLE, FULL, CANCELLED]
          description: "Trạng thái ca làm việc (Tùy chọn)"
          example: "CANCELLED"

    CreateArticleRequest:
      type: object
      required: [title, html_content]
      properties:
        title:
          type: string
          description: "Tiêu đề bài viết (Bắt buộc)"
          example: "Phòng ngừa bệnh tim mạch hiệu quả"
        thumbnail_url:
          type: string
          nullable: true
          description: "Ảnh đại diện bài viết (Tùy chọn)"
          example: "https://res.cloudinary.com/xxx/image/upload/article.jpg"
        short_description:
          type: string
          nullable: true
          description: "Mô tả ngắn (Tùy chọn)"
          example: "Hướng dẫn phòng ngừa các bệnh tim mạch"
        html_content:
          type: string
          description: "Nội dung HTML chi tiết (Bắt buộc)"
          example: "<h2>1. Chế độ ăn uống</h2><p>Hạn chế chất béo...</p>"
        specialty_id:
          type: integer
          nullable: true
          description: "ID chuyên khoa liên quan (Tùy chọn, Doctor tự gán theo chuyên khoa của mình)"
          example: 1
        author_id:
          type: integer
          description: "ID bác sĩ tác giả (Bắt buộc khi Admin tạo, Doctor tự lấy từ token)"
          example: 1

    UpdateArticleRequest:
      type: object
      properties:
        title:
          type: string
          description: "Tiêu đề bài viết (Tùy chọn)"
          example: "Phòng ngừa bệnh tim mạch - Cập nhật mới"
        thumbnail_url:
          type: string
          nullable: true
          description: "Ảnh đại diện (Tùy chọn)"
          example: "https://res.cloudinary.com/xxx/image/upload/article-new.jpg"
        short_description:
          type: string
          nullable: true
          description: "Mô tả ngắn (Tùy chọn)"
          example: "Cập nhật hướng dẫn mới"
        html_content:
          type: string
          description: "Nội dung HTML (Tùy chọn)"
          example: "<h2>Nội dung cập nhật</h2>"

    AddToCartRequest:
      type: object
      required: [package_id]
      properties:
        package_id:
          type: integer
          description: "ID gói khám cần thêm (Bắt buộc)"
          example: 1
        quantity:
          type: integer
          description: "Số lượng (Tùy chọn, mặc định = 1)"
          example: 1

    UpdateCartQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          description: "Số lượng mới (Bắt buộc, tối thiểu = 1)"
          example: 3

    CreateSpecialtyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
